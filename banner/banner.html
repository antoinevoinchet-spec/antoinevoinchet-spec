<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Profile banner</title>
<!-- Source of banner-light.png and banner-dark.png. Render instructions: see CREDITS.md. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600;700&family=JetBrains+Mono:wght@400;700&display=block" rel="stylesheet">
<style>
  /* Design units: 1280 x 420. Exported at 2x (2560 x 840) via ?zoom=2. */
  html, body { margin: 0; background: transparent; }
  img { display: block; }
  h1, p { margin: 0; width: fit-content; }

  #banner {
    zoom: var(--z, 1); width: 1280px; height: 420px; box-sizing: border-box;
    border-radius: 28px; overflow: hidden; position: relative;
    -webkit-font-smoothing: antialiased;
    --bg: #EDF1F7; --dot: rgba(40,70,120,0.24); --ink: #12151B; --muted: #444B58; --accent: #96401F; --icon: #4B5260;
    background: var(--bg); color: var(--ink);
  }
  #banner[data-theme="dark"] { --bg: #161B22; --dot: rgba(241,243,246,0.15); --ink: #F1F3F6; --muted: #A9B2C0; --accent: #E3896A; --icon: #B5BDC9; }
  .light-only { display: block; } .dark-only { display: none; }
  #banner[data-theme="dark"] .light-only { display: none; }
  #banner[data-theme="dark"] .dark-only { display: block; }

  /* Dotted background */
  .bg { position: absolute; inset: 0; background: radial-gradient(circle, var(--dot) 1.7px, transparent 2px) 14px 14px / 28px 28px; }

  /* Name, school, tagline */
  .text { position: absolute; left: 60px; top: 34px; }
  h1 { font: 700 96px/1 "Instrument Sans", sans-serif; letter-spacing: -2.5px; margin-bottom: 10px; }
  .school { display: flex; align-items: center; gap: 20px; margin-bottom: 16px; }
  .school p { font: 600 42px/1.1 "Instrument Sans", sans-serif; color: var(--muted); }
  .badge { width: 100px; height: 82px; border-radius: 18px; background: #fff; display: grid; place-items: center; box-shadow: 0 3px 10px rgba(0,0,0,0.16); }
  #banner[data-theme="light"] .badge { box-shadow: 0 0 0 2px #D5DAE1; }
  .badge img { height: 64px; }
  .tag { font: 400 30px/1.4 "JetBrains Mono", monospace; letter-spacing: -0.8px; white-space: pre; }
  .tag b { color: var(--accent); font-weight: 700; }

  /* Organisations: Kleep centred on the left three quarters, the other two 72 px from it */
  .orgs { position: absolute; left: 60px; right: 320px; bottom: 34px; display: grid; grid-template-columns: 1fr auto 1fr; column-gap: 72px; align-items: center; }
  .orgs .amadeus { height: 28px; justify-self: end; }
  .orgs .kleep { height: 36px; }
  .orgs .chappeo { height: 38px; justify-self: start; }
  #banner[data-theme="light"] .orgs .amadeus { filter: brightness(0); }
  #banner[data-theme="dark"] .orgs .kleep { filter: invert(1); }

  /* Claude Code mascot and its toolbox */
  .mascot { position: absolute; right: 72px; top: 40px; width: 210px; filter: drop-shadow(0 14px 18px rgba(0,0,0,0.25)); }
  .tools { position: absolute; right: 64px; top: 270px; width: 226px; display: grid; grid-template-columns: repeat(5, 30px); justify-content: space-between; row-gap: 20px; }
  .tools i { width: 30px; height: 30px; background: var(--icon); -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
</style>
</head>
<body>
<div id="banner" data-theme="light">
  <div class="bg"></div>
  <div class="text">
    <h1>Antoine Voinchet</h1>
    <div class="school"><p>ESSEC Grande École student</p><div class="badge"><img src="assets/logos/essec.svg" alt="ESSEC Business School"></div></div>
<p class="tag"><b>&gt;</b> I design, build and test AI products with
  Claude Code, and teach executives to work with AI.</p>
  </div>
  <div class="orgs">
    <img class="amadeus" src="assets/logos/amadeus-executives.webp" alt="Amadeus Executives">
    <img class="kleep" src="assets/logos/kleep.svg" alt="Kleep">
    <img class="chappeo light-only" src="assets/logos/chappeo-light.svg" alt="Chappeo">
    <img class="chappeo dark-only" src="assets/logos/chappeo-dark.svg" alt="Chappeo">
  </div>
  <img class="mascot" src="assets/mascot-3d.png" alt="Claude Code mascot">
  <div class="tools">
    <i style="--m:url(assets/icons/python.svg)"></i><i style="--m:url(assets/icons/pandas.svg)"></i><i style="--m:url(assets/icons/typescript.svg)"></i><i style="--m:url(assets/icons/nextdotjs.svg)"></i><i style="--m:url(assets/icons/postgresql.svg)"></i><i style="--m:url(assets/icons/supabase.svg)"></i><i style="--m:url(assets/icons/git.svg)"></i><i style="--m:url(assets/icons/make.svg)"></i><i style="--m:url(assets/icons/n8n.svg)"></i><i style="--m:url(assets/icons/googlechrome.svg)"></i>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search), b = document.getElementById('banner');
  b.dataset.theme = q.get('theme') === 'dark' ? 'dark' : 'light';
  if (q.get('zoom')) b.style.setProperty('--z', q.get('zoom'));
  document.fonts.ready.then(() => { const m = b.querySelector('.mascot'); (m.complete ? Promise.resolve() : new Promise(r => m.onload = m.onerror = r)).then(() => document.title = 'ready'); });
</script>
</body>
</html>
